apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: webapp-stack
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app : mysql
  template:
    metadata:
      labels:
        app: mysql 
    spec:
      containers:
      - name: mysql
        image: webapp-mysql:task2
        envFrom:
          - secretRef:
              name: mysql-secret
        livenessProbe:
          initialDelaySeconds: 60
        readinessProbe:
          exec:
            command:
              - mysqladmin
              - ping
              - -h
              - 127.0.0.1
        volumeMounts:
          - name: mysql-storage
            mountPath: /var/lib/mysql
      volumes:
        - name:  mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc