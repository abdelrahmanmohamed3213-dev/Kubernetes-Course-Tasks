apiVersion: apps/v1
kind: Deployment
metadata:
  name:  webapp-api
spec:
  selector:
    matchLabels:
      app: webapp-api
  template:
    metadata:
      labels:
        app:  webapp-api
    spec:
      containers:
      - image:  webapp-api:task2
        name:  webapp-backend
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          timeoutSeconds: 10
        ports:
        - containerPort: 8000